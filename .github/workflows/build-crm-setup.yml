name: Build CRM Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and verify CRM v1.1.0 base
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, zipfile
          parts = [Path(f"payload_v110/p{i:02d}.b64").read_text(encoding="utf-8").strip() for i in range(14)]
          encoded = "".join(parts)
          if len(encoded) != 54096:
              raise SystemExit(f"Payload length mismatch: {len(encoded)}")
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = "dd113344982d3eb6c1878bffed6d555d668472b4ea857b2c7c3f96407c829a46"
          if digest != expected:
              raise SystemExit(f"Base payload SHA-256 mismatch: {digest}")
          Path("crm_payload_v110.zip").write_bytes(data)
          with zipfile.ZipFile("crm_payload_v110.zip") as zf:
              zf.extractall("src")
          print("CRM v1.1.0 base verified:", digest)

      - name: Apply CRM v1.1.1 automatic discovery
        run: python patch_v111.py

      - name: Prepare CRM v1.1.2 patch for Windows
        run: python prepare_patch_v112.py

      - name: Apply CRM v1.1.2 LAN reliability fix
        run: python patch_v112.py

      - name: Normalize CRM v1.1.2 generated output
        run: python repair_v112_output.py

      - name: Verify updated source
        shell: python
        run: |
          from pathlib import Path
          app = Path("src/app.py").read_text(encoding="utf-8")
          net = Path("src/networking.py").read_text(encoding="utf-8")
          ver = Path("src/version.py").read_text(encoding="utf-8")
          ins = Path("src/installer.iss").read_text(encoding="utf-8")
          assert 'APP_VERSION = "1.1.2"' in ver
          assert 'def diagnose_server' in net
          assert 'def _http_request' in net
          assert 'http.client.HTTPConnection' in net
          assert 'profile=any remoteip=localsubnet' in ins
          assert 'CRM Farsi Program' in ins
          assert '#define MyAppVersion "1.1.2"' in ins
          assert 'سرور پیدا شد ولی ارتباط اصلی بسته است' in app
          assert 'سرور دیده شد ولی اتصال کامل نیست' in app
          print("CRM v1.1.2 source verification passed")

      - name: Install dependencies
        working-directory: src
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Smoke compile
        working-directory: src
        run: python -m py_compile app.py networking.py version.py

      - name: Network smoke test
        working-directory: src
        shell: python
        run: |
          import os, sys, time
          sys.path.insert(0, os.getcwd())
          from networking import LANServer, RemoteStore, ping_server, diagnose_server, SERVER_PORT
          class Dummy:
              schema_version = 3
              def network_info(self): return {"app_version":"1.1.2","schema":3,"persons":0}
              def has_users(self): return True
          srv = LANServer(Dummy(), SERVER_PORT, "1.1.2")
          srv.start(); time.sleep(.2)
          try:
              info = ping_server("127.0.0.1")
              assert info and info.get("ok")
              assert diagnose_server("127.0.0.1")[1] == "ok"
              assert RemoteStore("127.0.0.1").has_users() is True
              print("LAN server/RPC smoke test passed")
          finally:
              srv.stop()

      - name: Build CRM executable
        working-directory: src
        run: pyinstaller --noconfirm --clean --windowed --name CRM --icon assets/crm.ico app.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        working-directory: src
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Verify installer
        shell: powershell
        run: |
          $path = "src\dist-installer\CRM-Farsi-Setup-v1.1.2.exe"
          if (!(Test-Path $path)) { throw "Installer not found" }
          $file = Get-Item $path
          if ($file.Length -lt 1000000) { throw "Installer is unexpectedly small" }
          Write-Host "Installer:" $file.FullName
          Write-Host "Size:" $file.Length

      - name: Upload Setup
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Farsi-Setup-v1.1.2
          path: src/dist-installer/CRM-Farsi-Setup-v1.1.2.exe
          if-no-files-found: error
          retention-days: 30
