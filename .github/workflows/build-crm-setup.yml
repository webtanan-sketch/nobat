name: Build CRM Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and verify CRM v1.1.0 payload
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, zipfile

          parts = [Path(f"payload_v110/p{i:02d}.b64").read_text(encoding="utf-8").strip() for i in range(14)]
          encoded = "".join(parts)
          if len(encoded) != 54096:
              raise SystemExit(f"Payload length mismatch: {len(encoded)}")
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = "dd113344982d3eb6c1878bffed6d555d668472b4ea857b2c7c3f96407c829a46"
          if digest != expected:
              raise SystemExit(f"Payload SHA-256 mismatch: {digest}")
          Path("crm_payload_v110.zip").write_bytes(data)
          with zipfile.ZipFile("crm_payload_v110.zip") as zf:
              zf.extractall("src")
          for required in ("src/app.py", "src/networking.py", "src/version.py", "src/installer.iss", "src/assets/crm.ico"):
              if not Path(required).exists():
                  raise SystemExit(f"Missing source file: {required}")
          print("CRM v1.1.0 payload verified:", digest)

      - name: Install dependencies
        working-directory: src
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Smoke compile
        working-directory: src
        run: python -m py_compile app.py networking.py version.py

      - name: Build CRM executable
        working-directory: src
        run: pyinstaller --noconfirm --clean --windowed --name CRM --icon assets/crm.ico app.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        working-directory: src
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Verify installer
        shell: powershell
        run: |
          $path = "src\dist-installer\CRM-Farsi-Setup-v1.1.0.exe"
          if (!(Test-Path $path)) { throw "Installer not found" }
          $file = Get-Item $path
          if ($file.Length -lt 1000000) { throw "Installer is unexpectedly small" }
          Write-Host "Installer:" $file.FullName
          Write-Host "Size:" $file.Length

      - name: Upload Setup
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Farsi-Setup-v1.1.0
          path: src/dist-installer/CRM-Farsi-Setup-v1.1.0.exe
          if-no-files-found: error
          retention-days: 30
