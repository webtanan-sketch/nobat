name: Build CRM Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and verify CRM v1.1.0 base
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, zipfile

          parts = [Path(f"payload_v110/p{i:02d}.b64").read_text(encoding="utf-8").strip() for i in range(14)]
          encoded = "".join(parts)
          if len(encoded) != 54096:
              raise SystemExit(f"Payload length mismatch: {len(encoded)}")
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = "dd113344982d3eb6c1878bffed6d555d668472b4ea857b2c7c3f96407c829a46"
          if digest != expected:
              raise SystemExit(f"Base payload SHA-256 mismatch: {digest}")
          Path("crm_payload_v110.zip").write_bytes(data)
          with zipfile.ZipFile("crm_payload_v110.zip") as zf:
              zf.extractall("src")
          print("CRM v1.1.0 base verified:", digest)

      - name: Apply and verify CRM v1.1.1 source overlay
        shell: python
        run: |
          from pathlib import Path
          import hashlib, zipfile

          overlay = Path("payload_v111_overlay.zip")
          digest = hashlib.sha256(overlay.read_bytes()).hexdigest()
          expected = "9c281c210a46c4d05046dd200fd7039e5acd9c77dccf4872c7edc9865313a3f2"
          if digest != expected:
              raise SystemExit(f"Overlay SHA-256 mismatch: {digest}")
          with zipfile.ZipFile(overlay) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Overlay ZIP CRC failed: {bad}")
              zf.extractall("src")
          required = ["src/app.py", "src/networking.py", "src/version.py", "src/installer.iss", "src/assets/crm.ico"]
          for path in required:
              if not Path(path).exists():
                  raise SystemExit(f"Missing source file: {path}")
          app = Path("src/app.py").read_text(encoding="utf-8")
          net = Path("src/networking.py").read_text(encoding="utf-8")
          ver = Path("src/version.py").read_text(encoding="utf-8")
          ins = Path("src/installer.iss").read_text(encoding="utf-8")
          assert 'APP_VERSION = "1.1.1"' in ver
          assert 'اتصال خودکار به CRM' in app
          assert 'def _scan_local_subnets' in net
          assert 'def discover_servers(timeout=1.2, deep_scan=True)' in net
          assert '#define MyAppVersion "1.1.1"' in ins
          print("CRM v1.1.1 overlay verified:", digest)

      - name: Install dependencies
        working-directory: src
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Smoke compile
        working-directory: src
        run: python -m py_compile app.py networking.py version.py

      - name: Build CRM executable
        working-directory: src
        run: pyinstaller --noconfirm --clean --windowed --name CRM --icon assets/crm.ico app.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        working-directory: src
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Verify installer
        shell: powershell
        run: |
          $path = "src\dist-installer\CRM-Farsi-Setup-v1.1.1.exe"
          if (!(Test-Path $path)) { throw "Installer not found" }
          $file = Get-Item $path
          if ($file.Length -lt 1000000) { throw "Installer is unexpectedly small" }
          Write-Host "Installer:" $file.FullName
          Write-Host "Size:" $file.Length

      - name: Upload Setup
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Farsi-Setup-v1.1.1
          path: src/dist-installer/CRM-Farsi-Setup-v1.1.1.exe
          if-no-files-found: error
          retention-days: 30
