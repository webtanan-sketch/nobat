name: Build CRM Farsi v1.3.4 Black Icon

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-crm-v134-black.yml"
      - "patch_v131.py"
      - "patch_v132.py"
      - "patch_v133.py"
      - "patch_v134.py"
      - "payload_v110/**"
      - "payload_v130/**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild original CRM Farsi source and capture black icon
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, zipfile
          parts=[Path(f"payload_v110/p{i:02d}.b64").read_text(encoding="utf-8").strip() for i in range(14)]
          data=base64.b64decode("".join(parts), validate=True)
          expected="dd113344982d3eb6c1878bffed6d555d668472b4ea857b2c7c3f96407c829a46"
          digest=hashlib.sha256(data).hexdigest()
          if digest != expected:
              raise SystemExit(f"Legacy payload SHA mismatch: {digest}")
          Path("legacy.zip").write_bytes(data)
          with zipfile.ZipFile("legacy.zip") as zf:
              bad=zf.testzip()
              if bad: raise SystemExit(f"Legacy ZIP CRC failed: {bad}")
              zf.extractall("legacy")
          icon=Path("legacy/assets/crm.ico")
          if not icon.exists() or icon.stat().st_size < 100:
              raise SystemExit("Original CRM Farsi icon missing")
          print("Original CRM Farsi icon SHA256:", hashlib.sha256(icon.read_bytes()).hexdigest())

      - name: Rebuild and verify v1.3.0 source
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, zipfile
          chunks = [Path(f"payload_v130/p{i:02d}.b64").read_text(encoding="utf-8").strip() for i in range(6)]
          encoded = "".join(chunks)
          if len(encoded) != 68864:
              raise SystemExit(f"Payload length mismatch: {len(encoded)}")
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = "3878c103a0ae29a87b0e766375ed2f50ef63bd782a3546a56c2ccfb4929c7fcf"
          if digest != expected:
              raise SystemExit(f"Payload SHA-256 mismatch: {digest}")
          Path("crm_v130.zip").write_bytes(data)
          with zipfile.ZipFile("crm_v130.zip") as zf:
              bad = zf.testzip()
              if bad: raise SystemExit(f"ZIP CRC failed: {bad}")
              zf.extractall("src")
          Path("v130_icon.sha256").write_text(hashlib.sha256(Path("src/assets/crm.ico").read_bytes()).hexdigest(), encoding="ascii")
          print("Verified CRM v1.3.0 payload:", digest)

      - name: Apply v1.3.1 legacy-stage hotfix
        run: python patch_v131.py

      - name: Apply v1.3.2 CRM Farsi identity hotfix
        run: python patch_v132.py

      - name: Apply v1.3.3 missing-table hotfix
        run: python patch_v133.py

      - name: Apply v1.3.4 release bump
        run: python patch_v134.py

      - name: Restore original black CRM Farsi icon
        shell: python
        run: |
          from pathlib import Path
          import hashlib, shutil
          old=Path("legacy/assets/crm.ico")
          new=Path("src/assets/crm.ico")
          before=Path("v130_icon.sha256").read_text(encoding="ascii").strip()
          shutil.copy2(old,new)
          after=hashlib.sha256(new.read_bytes()).hexdigest()
          legacy=hashlib.sha256(old.read_bytes()).hexdigest()
          if after != legacy:
              raise SystemExit("Black icon copy verification failed")
          print("Black icon restored. Old v1.3.0 icon:", before)
          print("CRM Farsi black icon:", after)

      - name: Install build and test dependencies
        working-directory: src
        run: python -m pip install --upgrade pip pyinstaller pillow openpyxl

      - name: Compile all core modules
        working-directory: src
        run: python -m py_compile app.py networking.py version.py selftest_v130.py

      - name: Full CRM v1.3.4 self-test
        working-directory: src
        run: python selftest_v130.py

      - name: Verify exact CRM Farsi identity and data safety
        working-directory: src
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          v=Path('version.py').read_text(encoding='utf-8')
          i=Path('installer.iss').read_text(encoding='utf-8')
          a=Path('app.py').read_text(encoding='utf-8')
          assert 'APP_NAME = "CRM فارسی"' in v
          assert 'APP_VERSION = "1.3.4"' in v
          assert 'DB_SCHEMA_VERSION = 4' in v
          assert '#define MyAppName "CRM فارسی"' in i
          assert '#define MyAppVersion "1.3.4"' in i
          assert 'AppId={{E60E2F54-7DE1-4EAD-BFBE-984F53C18F7A}' in i
          assert 'DefaultDirName={autopf}\\CRM-Farsi' in i
          assert '{commonappdata}\\CRM-Farsi\\Data' in i
          assert 'legacy_stage_to_v4' in a
          assert 'CREATE TABLE IF NOT EXISTS sales_stage_events' in a
          assert 'CRM فارسی.lnk' in i
          assert 'CRM.lnk' in i
          assert '[UninstallDelete]' in i and '{commonappdata}\\CRM-Farsi' not in i.split('[UninstallDelete]',1)[1]
          current=hashlib.sha256(Path('assets/crm.ico').read_bytes()).hexdigest()
          legacy=hashlib.sha256(Path('../legacy/assets/crm.ico').read_bytes()).hexdigest()
          assert current == legacy
          print('CRM Farsi black-icon identity and data-retention checks passed')

      - name: Build CRM executable with original black icon
        working-directory: src
        run: pyinstaller --noconfirm --clean --windowed --name CRM --icon assets/crm.ico --hidden-import openpyxl app.py

      - name: Verify executable
        shell: powershell
        run: |
          $exe = "src\dist\CRM\CRM.exe"
          if (!(Test-Path $exe)) { throw "CRM.exe not found" }
          $f = Get-Item $exe
          if ($f.Length -lt 1000000) { throw "CRM.exe unexpectedly small" }
          Write-Host "CRM.exe size:" $f.Length

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Setup
        working-directory: src
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Verify final Setup
        shell: powershell
        run: |
          $path = "src\dist-installer\CRM-Farsi-Setup-v1.3.4.exe"
          if (!(Test-Path $path)) { throw "Installer not found" }
          $file = Get-Item $path
          if ($file.Length -lt 5000000) { throw "Installer is unexpectedly small" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash
          Write-Host "Installer:" $file.FullName
          Write-Host "Size:" $file.Length
          Write-Host "SHA256:" $hash

      - name: Upload tested Setup
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Farsi-Setup-v1.3.4-Black-Icon
          path: src/dist-installer/CRM-Farsi-Setup-v1.3.4.exe
          if-no-files-found: error
          retention-days: 30
